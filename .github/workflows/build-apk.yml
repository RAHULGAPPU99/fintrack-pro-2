<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoneyMap Pro - Ultimate Finance Suite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf for Professional Statement Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .hide { display: none !important; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col relative shadow-2xl overflow-x-hidden">

    <!-- 1. AUTHENTICATION & ONBOARDING SCREEN -->
    <div id="auth-screen" class="absolute inset-0 bg-gradient-to-br from-indigo-950 via-indigo-900 to-slate-950 z-50 flex flex-col justify-between p-6 text-white animate-fade">
        <div class="mt-10 text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600/30 rounded-3xl backdrop-blur-xl mb-4 border border-indigo-400/30 shadow-2xl shadow-indigo-500/20">
                <i class="fa-solid fa-wallet text-4xl text-indigo-400 animate-pulse"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight">MoneyMap Pro</h1>
            <p class="text-indigo-300 text-xs mt-1 uppercase tracking-wider font-semibold">Professional Business & Personal Finance</p>
        </div>
        <div class="bg-white/10 backdrop-blur-2xl p-6 rounded-3xl border border-white/15 shadow-2xl mb-6">
            <label class="block text-xs font-semibold text-indigo-200 mb-1.5 uppercase tracking-wider">Your Full Name</label>
            <input type="text" id="reg-name" placeholder="e.g. Rahul Sharma" class="w-full px-4 py-3.5 bg-black/30 border border-white/25 rounded-2xl text-white placeholder-indigo-300/40 focus:outline-none focus:border-indigo-400 mb-3 text-sm font-medium">
            <label class="block text-xs font-semibold text-indigo-200 mb-1.5 uppercase tracking-wider">Set 4-Digit Security PIN</label>
            <input type="password" id="reg-pin" maxlength="4" placeholder="••••" class="w-full px-4 py-3.5 bg-black/30 border border-white/25 rounded-2xl text-white placeholder-indigo-300/40 text-center text-xl tracking-widest focus:outline-none focus:border-indigo-400 mb-4">
            <button onclick="registerUser()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-2xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm active:scale-95">
                <span>Get Started</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- 2. SECURE PIN LOCK SCREEN -->
    <div id="lock-screen" class="absolute inset-0 bg-slate-950 z-40 flex flex-col items-center justify-center p-6 text-white hide animate-fade">
        <div class="w-16 h-16 bg-indigo-600/20 rounded-2xl flex items-center justify-center mb-4 border border-indigo-500/30 shadow-lg">
            <i class="fa-solid fa-shield-halved text-3xl text-indigo-400"></i>
        </div>
        <h2 class="text-xl font-bold">Welcome Back</h2>
        <p class="text-slate-400 text-xs mb-6 font-medium">Enter your 4-digit security PIN</p>
        <div class="flex gap-4 mb-8">
            <input type="password" maxlength="1" class="pin-box w-12 h-12 text-center text-2xl bg-slate-900 border border-slate-700 rounded-2xl text-white shadow-inner" readonly>
            <input type="password" maxlength="1" class="pin-box w-12 h-12 text-center text-2xl bg-slate-900 border border-slate-700 rounded-2xl text-white shadow-inner" readonly>
            <input type="password" maxlength="1" class="pin-box w-12 h-12 text-center text-2xl bg-slate-900 border border-slate-700 rounded-2xl text-white shadow-inner" readonly>
            <input type="password" maxlength="1" class="pin-box w-12 h-12 text-center text-2xl bg-slate-900 border border-slate-700 rounded-2xl text-white shadow-inner" readonly>
        </div>
        <div class="grid grid-cols-3 gap-3.5 w-64">
            <button onclick="pressPin('1')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">1</button>
            <button onclick="pressPin('2')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">2</button>
            <button onclick="pressPin('3')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">3</button>
            <button onclick="pressPin('4')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">4</button>
            <button onclick="pressPin('5')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">5</button>
            <button onclick="pressPin('6')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">6</button>
            <button onclick="pressPin('7')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">7</button>
            <button onclick="pressPin('8')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">8</button>
            <button onclick="pressPin('9')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">9</button>
            <button onclick="biometricAuth()" class="py-3.5 bg-indigo-950/60 text-indigo-400 rounded-2xl text-sm border border-indigo-900/50 flex items-center justify-center active:scale-95 transition"><i class="fa-solid fa-fingerprint text-xl"></i></button>
            <button onclick="pressPin('0')" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl font-bold text-lg border border-slate-800 active:scale-95 transition">0</button>
            <button onclick="clearPin()" class="py-3.5 bg-slate-900 hover:bg-slate-800 rounded-2xl text-rose-400 border border-slate-800 active:scale-95 transition"><i class="fa-solid fa-delete-left text-lg"></i></button>
        </div>
    </div>

    <!-- MAIN APP HEADER -->
    <header class="bg-indigo-600 text-white p-4 pt-6 shadow-lg flex justify-between items-center rounded-b-3xl">
        <div class="flex items-center gap-3">
            <div id="user-avatar" class="w-11 h-11 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center font-extrabold text-white text-base shadow-md border border-white/20">U</div>
            <div>
                <span class="text-[10px] text-indigo-200 uppercase tracking-widest font-bold">MoneyMap Pro</span>
                <h2 id="header-name" class="text-base font-extrabold leading-tight">My Finances</h2>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="lockApp()" class="w-9 h-9 bg-indigo-700/60 hover:bg-indigo-700 rounded-xl flex items-center justify-center text-indigo-100 transition shadow-sm"><i class="fa-solid fa-lock text-xs"></i></button>
        </div>
    </header>

    <!-- SCROLLABLE CONTENT CONTAINER -->
    <main class="flex-1 pb-28 overflow-y-auto p-4 space-y-4">
        
        <!-- HOME / DASHBOARD TAB -->
        <section id="tab-home" class="space-y-4 animate-fade">
            <!-- Balance Card -->
            <div class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 p-5 rounded-3xl text-white shadow-xl shadow-indigo-600/20 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[11px] text-indigo-200 font-bold uppercase tracking-wider">Total Net Balance</p>
                        <h3 id="total-balance" class="text-3xl font-extrabold mt-1 tracking-tight">₹0.00</h3>
                    </div>
                    <span class="px-2.5 py-1 bg-white/15 backdrop-blur-md rounded-xl text-[10px] font-bold tracking-wide uppercase border border-white/20"><i class="fa-solid fa-shield-check mr-1"></i> Secure</span>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-white/15">
                    <div class="bg-black/10 p-2.5 rounded-2xl backdrop-blur-sm">
                        <span class="text-[10px] text-emerald-300 font-semibold flex items-center gap-1 uppercase"><i class="fa-solid fa-arrow-down-long"></i> Income</span>
                        <p id="total-income" class="text-base font-extrabold mt-0.5">₹0</p>
                    </div>
                    <div class="bg-black/10 p-2.5 rounded-2xl backdrop-blur-sm">
                        <span class="text-[10px] text-rose-300 font-semibold flex items-center gap-1 uppercase"><i class="fa-solid fa-arrow-up-long"></i> Expense</span>
                        <p id="total-expense" class="text-base font-extrabold mt-0.5">₹0</p>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Row (Loans & Cards summary) -->
            <div class="grid grid-cols-2 gap-3">
                <div onclick="switchTab('loans')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer hover:border-indigo-200 transition active:scale-95">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-landmark text-base"></i></div>
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Loan EMIs</p>
                        <p id="home-emi" class="text-xs font-extrabold text-slate-800">₹0</p>
                    </div>
                </div>
                <div onclick="switchTab('cards')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-3 cursor-pointer hover:border-purple-200 transition active:scale-95">
                    <div class="w-10 h-10 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-credit-card text-base"></i></div>
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase">Card Dues</p>
                        <p id="home-cards" class="text-xs font-extrabold text-slate-800">₹0</p>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-extrabold text-slate-800 text-sm">Recent Transactions</h4>
                    <button onclick="switchTab('entries')" class="text-xs text-indigo-600 font-bold hover:underline">View All</button>
                </div>
                <div id="recent-transactions" class="space-y-2.5">
                    <p class="text-xs text-slate-400 text-center py-6 font-medium">No transactions recorded yet.</p>
                </div>
            </div>
        </section>

        <!-- ENTRIES TAB (Income & Expense Ledger) -->
        <section id="tab-entries" class="space-y-4 hide animate-fade">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 mb-3 text-sm"><i class="fa-solid fa-circle-plus text-indigo-600 mr-1"></i> Add Transaction</h3>
                <form onsubmit="addTransaction(event)" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="setTxType('expense')" id="btn-exp" class="py-2.5 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-sm transition">Expense (-)</button>
                        <button type="button" onclick="setTxType('income')" id="btn-inc" class="py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 transition">Income (+)</button>
                    </div>
                    <input type="text" id="tx-title" placeholder="Description (e.g. Salary, Groceries)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="tx-amount" placeholder="Amount (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                        <input type="date" id="tx-date" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md shadow-indigo-600/20 transition">Save Entry</button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-extrabold text-slate-800 text-sm">All Entries</h3>
                    <button onclick="exportPDF()" class="text-[11px] bg-purple-50 text-purple-600 px-3 py-1.5 rounded-xl font-bold border border-purple-100 flex items-center gap-1"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
                </div>
                <div id="entries-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- LOANS & EMIS TAB -->
        <section id="tab-loans" class="space-y-4 hide animate-fade">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 mb-3 text-sm"><i class="fa-solid fa-landmark text-indigo-600 mr-1"></i> Manage Loan & EMIs</h3>
                <form onsubmit="addLoan(event)" class="space-y-3">
                    <input type="text" id="loan-name" placeholder="Loan Name (e.g. Home Loan, Car EMI)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="loan-emi" placeholder="Monthly EMI (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                        <input type="number" id="loan-total" placeholder="Total Balance (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md shadow-indigo-600/20 transition">Add Loan Account</button>
                </form>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 text-sm mb-3">Active Loans</h3>
                <div id="loans-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- CREDIT CARDS TAB -->
        <section id="tab-cards" class="space-y-4 hide animate-fade">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 mb-3 text-sm"><i class="fa-solid fa-credit-card text-purple-600 mr-1"></i> Credit Card Tracker</h3>
                <form onsubmit="addCard(event)" class="space-y-3">
                    <input type="text" id="card-name" placeholder="Card Name (e.g. HDFC Regalia)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-purple-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="card-due" placeholder="Current Dues (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-purple-500">
                        <input type="number" id="card-limit" placeholder="Credit Limit (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-purple-500">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-md shadow-purple-600/20 transition">Add Credit Card</button>
                </form>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 text-sm mb-3">Your Credit Cards</h3>
                <div id="cards-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- MORE MENU TAB (Udhar, Cash Counter, Backup & Restore) -->
        <section id="tab-more" class="space-y-3 hide animate-fade">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-2.5">
                <h3 class="font-extrabold text-slate-800 text-sm mb-3">Advanced Tools & Settings</h3>
                
                <div onclick="openSubMenu('udhar')" class="flex justify-between items-center p-3.5 bg-slate-50 hover:bg-slate-100 rounded-2xl cursor-pointer transition active:scale-95">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-hand-holding-dollar text-base"></i></div>
                        <div><p class="font-bold text-xs text-slate-800">Udhar Khata (Lent / Borrowed)</p><p class="text-[10px] text-slate-400 font-semibold">Track customer dues & borrowed money</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                </div>

                <div onclick="openSubMenu('calc')" class="flex justify-between items-center p-3.5 bg-slate-50 hover:bg-slate-100 rounded-2xl cursor-pointer transition active:scale-95">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-calculator text-base"></i></div>
                        <div><p class="font-bold text-xs text-slate-800">Cash Denomination Counter</p><p class="text-[10px] text-slate-400 font-semibold">Count shop cash notes & coins</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                </div>

                <div onclick="openSubMenu('backup')" class="flex justify-between items-center p-3.5 bg-slate-50 hover:bg-slate-100 rounded-2xl cursor-pointer transition active:scale-95">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center"><i class="fa-solid fa-cloud-arrow-down text-base"></i></div>
                        <div><p class="font-bold text-xs text-slate-800">Data Backup & Restore</p><p class="text-[10px] text-slate-400 font-semibold">Export/Import JSON local backup</p></div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                </div>
            </div>
        </section>

        <!-- SUB-SECTION: UDHAR KHATA -->
        <section id="sub-udhar" class="space-y-4 hide animate-fade">
            <button onclick="closeSubMenu()" class="text-xs text-indigo-600 font-bold flex items-center gap-1 mb-2"><i class="fa-solid fa-arrow-left"></i> Back to More</button>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 mb-3 text-sm">Customer Udhar Khata</h3>
                <form onsubmit="addUdhar(event)" class="space-y-3">
                    <input type="text" id="udhar-name" placeholder="Customer Name" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-amber-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="udhar-amount" placeholder="Amount (₹)" required class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:outline-none focus:border-amber-500">
                        <select id="udhar-type" class="w-full px-3.5 py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none">
                            <option value="given">You Gave (Lena hai)</option>
                            <option value="taken">You Took (Dena hai)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs shadow-md shadow-amber-600/20 transition">Add Khata Entry</button>
                </form>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-800 text-sm mb-3">Khata Accounts</h3>
                <div id="udhar-list" class="space-y-2"></div>
            </div>
        </section>

        <!-- SUB-SECTION: CASH CALCULATOR -->
        <section id="sub-calc" class="space-y-4 hide animate-fade">
            <button onclick="closeSubMenu()" class="text-xs text-indigo-600 font-bold flex items-center gap-1 mb-2"><i class="fa-solid fa-arrow-left"></i> Back to More</button>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-extrabold text-slate-800 text-sm">Cash Counter</h3>
                    <span id="cash-total" class="text-xl font-extrabold text-emerald-600">₹0</span>
                </div>
                <div class="space-y-2" id="denom-inputs"></div>
            </div>
        </section>

        <!-- SUB-SECTION: BACKUP & RESTORE -->
        <section id="sub-backup" class="space-y-4 hide animate-fade">
            <button onclick="closeSubMenu()" class="text-xs text-indigo-600 font-bold flex items-center gap-1 mb-2"><i class="fa-solid fa-arrow-left"></i> Back to More</button>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-extrabold text-slate-800 text-base">Data Backup & Restore</h3>
                <p class="text-xs text-slate-500 font-medium leading-relaxed">Secure your ledger data by downloading a local backup file, or restore data anytime.</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="backupData()" class="py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-2xl text-xs border border-indigo-200 flex items-center justify-center gap-2 transition">
                        <i class="fa-solid fa-cloud-arrow-down text-sm"></i> Export Backup
                    </button>
                    <label class="py-3 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-2xl text-xs border border-emerald-200 flex items-center justify-center gap-2 cursor-pointer transition">
                        <i class="fa-solid fa-cloud-arrow-up text-sm"></i> Restore Data
                        <input type="file" accept=".json" onchange="restoreData(event)" class="hide">
                    </label>
                </div>
                <div class="pt-4 border-t border-slate-100">
                    <button onclick="resetApp()" class="w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-2xl text-xs border border-rose-200 transition">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Factory Reset App Data
                    </button>
                </div>
            </div>
        </section>

        <!-- HIDDEN PDF REPORT TEMPLATE -->
        <div id="pdf-report-content" class="p-6 bg-white hide">
            <div class="text-center pb-4 border-b border-slate-200 mb-4">
                <h2 class="text-2xl font-extrabold text-indigo-600">MoneyMap Pro Statement</h2>
                <p id="pdf-date" class="text-[11px] text-slate-400 mt-1"></p>
            </div>
            <div class="mb-4">
                <h4 class="font-bold text-xs text-slate-700 mb-2 uppercase">Financial Summary</h4>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="p-2.5 bg-slate-50 rounded-xl"><p class="text-[10px] text-slate-500 font-bold">Balance</p><p id="pdf-bal" class="font-extrabold text-sm text-indigo-600">₹0</p></div>
                    <div class="p-2.5 bg-emerald-50 rounded-xl"><p class="text-[10px] text-emerald-600 font-bold">Income</p><p id="pdf-inc" class="font-extrabold text-sm text-emerald-700">₹0</p></div>
                    <div class="p-2.5 bg-rose-50 rounded-xl"><p class="text-[10px] text-rose-600 font-bold">Expense</p><p id="pdf-exp" class="font-extrabold text-sm text-rose-700">₹0</p></div>
                </div>
            </div>
            <table class="w-full text-left text-[11px] border-collapse">
                <thead><tr class="border-b border-slate-200 bg-slate-100 text-slate-600"><th class="p-2">Date</th><th class="p-2">Description</th><th class="p-2">Type</th><th class="p-2 text-right">Amount</th></tr></thead>
                <tbody id="pdf-table-body"></tbody>
            </table>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-4 py-2.5 flex justify-around items-center z-30 shadow-2xl rounded-t-3xl">
        <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-indigo-600 transition" data-tab="home">
            <i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-bold mt-1">Home</span>
        </button>
        <button onclick="switchTab('entries')" class="nav-btn flex flex-col items-center text-slate-400 hover:text-indigo-600 transition" data-tab="entries">
            <i class="fa-solid fa-book text-lg"></i><span class="text-[10px] font-bold mt-1">Entries</span>
        </button>
        <button onclick="switchTab('loans')" class="nav-btn flex flex-col items-center text-slate-400 hover:text-indigo-600 transition" data-tab="loans">
            <i class="fa-solid fa-landmark text-lg"></i><span class="text-[10px] font-bold mt-1">Loans</span>
        </button>
        <button onclick="switchTab('cards')" class="nav-btn flex flex-col items-center text-slate-400 hover:text-indigo-600 transition" data-tab="cards">
            <i class="fa-solid fa-credit-card text-lg"></i><span class="text-[10px] font-bold mt-1">Cards</span>
        </button>
        <button onclick="switchTab('more')" class="nav-btn flex flex-col items-center text-slate-400 hover:text-indigo-600 transition" data-tab="more">
            <i class="fa-solid fa-bars text-lg"></i><span class="text-[10px] font-bold mt-1">More</span>
        </button>
    </nav>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let currentTxType = 'expense';
        let enteredPin = "";
        let userData = JSON.parse(localStorage.getItem('mm_user')) || null;
        let transactions = JSON.parse(localStorage.getItem('mm_tx')) || [];
        let loans = JSON.parse(localStorage.getItem('mm_loans')) || [];
        let cards = JSON.parse(localStorage.getItem('mm_cards')) || [];
        let udharList = JSON.parse(localStorage.getItem('mm_udhar')) || [];
        const denominations = [2000, 500, 200, 100, 50, 20, 10, 5, 2, 1];

        window.onload = function() {
            if (!userData) {
                document.getElementById('auth-screen').classList.remove('hide');
            } else {
                document.getElementById('auth-screen').classList.add('hide');
                document.getElementById('lock-screen').classList.remove('hide');
                document.getElementById('header-name').innerText = userData.name;
                document.getElementById('user-avatar').innerText = userData.name.charAt(0).toUpperCase();
            }
            renderAll();
            initCashCalc();
            document.getElementById('tx-date').valueAsDate = new Date();
        };

        function registerUser() {
            const name = document.getElementById('reg-name').value.trim();
            const pin = document.getElementById('reg-pin').value.trim();
            if(!name || pin.length !== 4) return alert('Enter valid name & 4-digit PIN.');
            userData = { name, pin };
            localStorage.setItem('mm_user', JSON.stringify(userData));
            document.getElementById('auth-screen').classList.add('hide');
            document.getElementById('header-name').innerText = name;
            document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();
            renderAll();
        }

        function lockApp() {
            document.getElementById('lock-screen').classList.remove('hide');
            enteredPin = "";
            updatePinDots();
        }

        function pressPin(num) {
            if(enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if(enteredPin.length === 4) {
                    setTimeout(() => {
                        if(userData && enteredPin === userData.pin) {
                            document.getElementById('lock-screen').classList.add('hide');
                            enteredPin = "";
                            updatePinDots();
                        } else {
                            alert('Incorrect PIN!');
                            enteredPin = "";
                            updatePinDots();
                        }
                    }, 150);
                }
            }
        }

        function clearPin() { enteredPin = ""; updatePinDots(); }
        function updatePinDots() {
            document.querySelectorAll('.pin-box').forEach((box, i) => { box.value = i < enteredPin.length ? "•" : ""; });
        }
        function biometricAuth() { alert('Biometric verified!'); document.getElementById('lock-screen').classList.add('hide'); }

        function switchTab(tabId) {
            ['home', 'entries', 'loans', 'cards', 'more', 'sub-udhar', 'sub-calc', 'sub-backup'].forEach(t => {
                const el = document.getElementById('tab-' + t) || document.getElementById(t);
                if(el) el.classList.add('hide');
            });
            const target = document.getElementById('tab-' + tabId);
            if(target) target.classList.remove('hide');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.tab === tabId) {
                    btn.classList.remove('text-slate-400'); btn.classList.add('text-indigo-600');
                } else {
                    btn.classList.remove('text-indigo-600'); btn.classList.add('text-slate-400');
                }
            });
        }

        function openSubMenu(subId) {
            ['tab-more'].forEach(t => document.getElementById(t).classList.add('hide'));
            document.getElementById('sub-' + subId).classList.remove('hide');
        }

        function closeSubMenu() {
            ['sub-udhar', 'sub-calc', 'sub-backup'].forEach(t => document.getElementById(t).classList.add('hide'));
            document.getElementById('tab-more').classList.remove('hide');
        }

        function setTxType(type) {
            currentTxType = type;
            if(type === 'expense') {
                document.getElementById('btn-exp').className = "py-2.5 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-sm transition";
                document.getElementById('btn-inc').className = "py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 transition";
            } else {
                document.getElementById('btn-exp').className = "py-2.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 transition";
                document.getElementById('btn-inc').className = "py-2.5 rounded-xl text-xs font-bold bg-emerald-500 text-white shadow-sm transition";
            }
        }

        function addTransaction(e) {
            e.preventDefault();
            const title = document.getElementById('tx-title').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const date = document.getElementById('tx-date').value;
            transactions.unshift({ id: Date.now(), title, amount, type: currentTxType, date });
            localStorage.setItem('mm_tx', JSON.stringify(transactions));
            e.target.reset();
            document.getElementById('tx-date').valueAsDate = new Date();
            setTxType('expense');
            renderAll();
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            localStorage.setItem('mm_tx', JSON.stringify(transactions));
            renderAll();
        }

        function addLoan(e) {
            e.preventDefault();
            const name = document.getElementById('loan-name').value;
            const emi = parseFloat(document.getElementById('loan-emi').value);
            const total = parseFloat(document.getElementById('loan-total').value);
            loans.unshift({ id: Date.now(), name, emi, total });
            localStorage.setItem('mm_loans', JSON.stringify(loans));
            e.target.reset();
            renderAll();
        }

        function deleteLoan(id) {
            loans = loans.filter(l => l.id !== id);
            localStorage.setItem('mm_loans', JSON.stringify(loans));
            renderAll();
        }

        function addCard(e) {
            e.preventDefault();
            const name = document.getElementById('card-name').value;
            const due = parseFloat(document.getElementById('card-due').value);
            const limit = parseFloat(document.getElementById('card-limit').value);
            cards.unshift({ id: Date.now(), name, due, limit });
            localStorage.setItem('mm_cards', JSON.stringify(cards));
            e.target.reset();
            renderAll();
        }

        function deleteCard(id) {
            cards = cards.filter(c => c.id !== id);
            localStorage.setItem('mm_cards', JSON.stringify(cards));
            renderAll();
        }

        function addUdhar(e) {
            e.preventDefault();
            const name = document.getElementById('udhar-name').value;
            const amount = parseFloat(document.getElementById('udhar-amount').value);
            const type = document.getElementById('udhar-type').value;
            udharList.unshift({ id: Date.now(), name, amount, type });
            localStorage.setItem('mm_udhar', JSON.stringify(udharList));
            e.target.reset();
            renderAll();
        }

        function deleteUdhar(id) {
            udharList = udharList.filter(u => u.id !== id);
            localStorage.setItem('mm_udhar', JSON.stringify(udharList));
            renderAll();
        }

        function initCashCalc() {
            const container = document.getElementById('denom-inputs');
            if(!container) return;
            container.innerHTML = denominations.map(d => `
                <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                    <span class="font-bold text-xs text-slate-700">₹${d}</span>
                    <div class="flex items-center gap-2">
                        <input type="number" min="0" value="0" data-val="${d}" oninput="calcCash()" class="denom-qty w-16 text-center py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-bold focus:outline-none">
                        <span id="sub-${d}" class="text-xs font-extrabold text-slate-600 w-16 text-right">₹0</span>
                    </div>
                </div>
            `).join('');
        }

        function calcCash() {
            let total = 0;
            document.querySelectorAll('.denom-qty').forEach(input => {
                const val = parseInt(input.dataset.val);
                const qty = parseInt(input.value) || 0;
                const sub = val * qty;
                total += sub;
                document.getElementById('sub-' + val).innerText = '₹' + sub;
            });
            document.getElementById('cash-total').innerText = '₹' + total.toLocaleString('en-IN');
        }

        function renderAll() {
            let inc = 0, exp = 0, totalEmi = 0, totalCards = 0;
            transactions.forEach(t => { if(t.type === 'income') inc += t.amount; else exp += t.amount; });
            loans.forEach(l => totalEmi += l.emi);
            cards.forEach(c => totalCards += c.due);

            const bal = inc - exp;
            document.getElementById('total-balance').innerText = '₹' + bal.toLocaleString('en-IN');
            document.getElementById('total-income').innerText = '₹' + inc.toLocaleString('en-IN');
            document.getElementById('total-expense').innerText = '₹' + exp.toLocaleString('en-IN');
            document.getElementById('home-emi').innerText = '₹' + totalEmi.toLocaleString('en-IN');
            document.getElementById('home-cards').innerText = '₹' + totalCards.toLocaleString('en-IN');

            const txHTML = transactions.map(t => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center ${t.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                            <i class="fa-solid ${t.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                        </div>
                        <div><p class="font-bold text-xs text-slate-800">${t.title}</p><p class="text-[10px] text-slate-400 font-semibold">${t.date}</p></div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-xs ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${t.type === 'income' ? '+' : '-'}₹${t.amount.toLocaleString('en-IN')}</span>
                        <button onclick="deleteTx(${t.id})" class="text-slate-300 hover:text-rose-500 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('recent-transactions').innerHTML = txHTML || '<p class="text-xs text-slate-400 text-center py-4 font-medium">No entries yet.</p>';
            document.getElementById('entries-list').innerHTML = txHTML || '<p class="text-xs text-slate-400 text-center py-4 font-medium">No entries yet.</p>';

            document.getElementById('loans-list').innerHTML = loans.map(l => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div><p class="font-bold text-xs text-slate-800">${l.name}</p><p class="text-[10px] text-indigo-600 font-bold">EMI: ₹${l.emi.toLocaleString('en-IN')}/mo</p></div>
                    <div class="flex items-center gap-3"><span class="font-bold text-xs text-slate-700">Bal: ₹${l.total.toLocaleString('en-IN')}</span><button onclick="deleteLoan(${l.id})" class="text-slate-300 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400 text-center py-4">No loans added.</p>';

            document.getElementById('cards-list').innerHTML = cards.map(c => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div><p class="font-bold text-xs text-slate-800">${c.name}</p><p class="text-[10px] text-purple-600 font-bold">Limit: ₹${c.limit.toLocaleString('en-IN')}</p></div>
                    <div class="flex items-center gap-3"><span class="font-bold text-xs text-rose-600">Due: ₹${c.due.toLocaleString('en-IN')}</span><button onclick="deleteCard(${c.id})" class="text-slate-300 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400 text-center py-4">No cards added.</p>';

            document.getElementById('udhar-list').innerHTML = udharList.map(u => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <div><p class="font-bold text-xs text-slate-800">${u.name}</p><span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${u.type === 'given' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}">${u.type === 'given' ? 'Lena hai' : 'Dena hai'}</span></div>
                    <div class="flex items-center gap-3"><span class="font-bold text-xs ${u.type === 'given' ? 'text-amber-600' : 'text-blue-600'}">₹${u.amount.toLocaleString('en-IN')}</span><button onclick="deleteUdhar(${u.id})" class="text-slate-300 hover:text-rose-500 text-xs"><i class="fa-solid fa-trash"></i></button></div>
                </div>
            `).join('') || '<p class="text-xs text-slate-400 text-center py-4">No khata records.</p>';
        }

        function backupData() {
            const backupObj = { user: userData, tx: transactions, loans, cards, udhar: udharList };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj));
            const dl = document.createElement('a'); dl.href = dataStr; dl.download = "MoneyMap_Backup.json";
            document.body.appendChild(dl); dl.click(); dl.remove();
        }

        function restoreData(event) {
            const file = event.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const p = JSON.parse(e.target.result);
                    if(p.user && p.tx) {
                        localStorage.setItem('mm_user', JSON.stringify(p.user));
                        localStorage.setItem('mm_tx', JSON.stringify(p.tx));
                        localStorage.setItem('mm_loans', JSON.stringify(p.loans || []));
                        localStorage.setItem('mm_cards', JSON.stringify(p.cards || []));
                        localStorage.setItem('mm_udhar', JSON.stringify(p.udhar || []));
                        location.reload();
                    } else alert('Invalid backup format.');
                } catch(err) { alert('Error reading file.'); }
            };
            reader.readAsText(file);
        }

        function resetApp() {
            if(confirm('Reset all data?')) { localStorage.clear(); location.reload(); }
        }

        function exportPDF() {
            let inc = 0, exp = 0;
            transactions.forEach(t => { t.type === 'income' ? inc += t.amount : exp += t.amount; });
            const bal = inc - exp;
            document.getElementById('pdf-date').innerText = "Generated: " + new Date().toLocaleString();
            document.getElementById('pdf-bal').innerText = '₹' + bal.toLocaleString('en-IN');
            document.getElementById('pdf-inc').innerText = '₹' + inc.toLocaleString('en-IN');
            document.getElementById('pdf-exp').innerText = '₹' + exp.toLocaleString('en-IN');
            document.getElementById('pdf-table-body').innerHTML = transactions.map(t => `
                <tr class="border-b border-slate-100"><td class="p-2">${t.date}</td><td class="p-2 font-bold">${t.title}</td><td class="p-2 uppercase font-bold text-[10px] ${t.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">${t.type}</td><td class="p-2 text-right font-bold">₹${t.amount.toLocaleString('en-IN')}</td></tr>
            `).join('') || `<tr><td colspan="4" class="p-4 text-center">No transactions</td></tr>`;
            html2pdf().from(document.getElementById('pdf-report-content')).save('MoneyMap_Statement.pdf');
        }
    </script>
</body>
</html>
